rules:
  # ── Bronze ──────────────────────────────────────────────────────────
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: exempt
    comment: >
      Custom integration; no automated test suite. Manually verified via UI.
  dependency-transparency: done
  docs-high-level-description:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-installation-instructions:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-removal-instructions:
    status: exempt
    comment: Custom integration without a separate documentation site.
  entity-translations: done
  entity-unique-id: done
  has-entity-name: done
  inject-websession: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ── Silver ──────────────────────────────────────────────────────────
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Custom integration without a separate documentation site.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: exempt
    comment: >
      Custom integration; no automated test suite present.
      Manually tested via the UI and manual integration testing.

  # ── Gold ────────────────────────────────────────────────────────────
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: >
      Zeroconf is used only for initial discovery. IP address changes require
      manual reconfiguration, as the user statically configures the client.
  docs-data-update:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-examples:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-supported-devices:
    status: exempt
    comment: >
      Works with any device running the ha-windows-shutdown Go client.
  docs-supported-functions:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-troubleshooting:
    status: exempt
    comment: Custom integration without a separate documentation site.
  docs-use-cases:
    status: exempt
    comment: Custom integration without a separate documentation site.
  dynamic-devices:
    status: exempt
    comment: >
      Each config entry represents exactly one static device.
  entity-category:
    status: exempt
    comment: >
      The shutdown button is a primary control, not a configuration entity.
  exception-translations: done
  reconfiguration-flow: done
  stale-devices:
    status: exempt
    comment: >
      Each config entry corresponds to exactly one device. Removing the entry
      removes the device — there are no orphaned devices possible.
